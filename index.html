<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verejná mienka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('mr_theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#151a24; --muted:#6a7282; --line:#e4e7ec;
    --accent:#0b4ea2; --accent-soft:#e7effa;
    --up:#1f9d55; --up-soft:#e3f5ea; --down:#d63b3b; --down-soft:#fbe7e7; --track:#e9ecf1;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
    --head:#fafbfc; --hover:#f3f5f8; --field:#ffffff; --onink:#ffffff;
    --demo-bg:#fff7e0; --demo-line:#f3df9e; --demo-ink:#6b5000;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0e1117; --card:#161a22; --ink:#e7e9ee; --muted:#9aa3b3; --line:#272d38;
    --accent:#6ea8ff; --accent-soft:#1b2940;
    --up:#34c06f; --up-soft:#14301f; --down:#ff6b6b; --down-soft:#3a1d1f; --track:#2a303b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --head:#1a1f28; --hover:#1c212b; --field:#0f131a; --onink:#0e1117;
    --demo-bg:#2b2410; --demo-line:#5a4a1a; --demo-ink:#f1d98a;
    color-scheme: dark;
  }
  body{transition:background .2s,color .2s}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.4}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}

  /* header */
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:54px;gap:10px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:-.02em}
  .logo-mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#0b4ea2 0 50%,#d63b3b 50% 100%);display:grid;place-items:center;color:#fff}
  .logo-mark svg{width:15px;height:15px}
  .user{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);min-width:0}
  .user .email{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{background:var(--ink);color:var(--onink);font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 12px;font-weight:600;font-size:13px;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onink)}
  .btn.primary:hover{filter:brightness(.9);background:var(--accent)}
  .btn.danger{color:var(--down);border-color:#f1c4c4}
  .btn.danger:hover{background:var(--down-soft)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--hover);color:var(--ink)}
  .theme-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;color:var(--ink);flex:none}
  .theme-btn:hover{background:var(--hover)}
  .theme-btn svg{width:16px;height:16px}
  .btn:disabled{opacity:.55;cursor:not-allowed}

  /* hero */
  .hero{padding:22px 0 8px}
  .hero h1{margin:0;font-size:clamp(22px,3.4vw,30px);font-weight:800;letter-spacing:-.03em}
  .hero p{margin:4px 0 0;color:var(--muted);max-width:620px;font-size:13.5px}
  .hero a{color:var(--accent)}

  .notice{margin:12px 0 0;padding:8px 12px;border-radius:9px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .notice.demo{display:block;background:var(--demo-bg);border:1px solid var(--demo-line);color:var(--demo-ink)}
  .notice.admin{background:#151a24;color:#e9ecf1}
  .notice.admin .btn{background:transparent;color:#fff;border-color:#3a4252;padding:5px 10px;font-size:13px}
  .notice.admin .btn:hover{background:#262d3b}
  .notice .spacer{flex:1}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:16px 0 10px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .chip .n{opacity:.6;font-weight:500;margin-left:4px}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
  .tools-right{display:flex;gap:8px;flex-wrap:wrap}
  .search,.sort{border:1px solid var(--line);background:var(--field);border-radius:9px;padding:6px 10px;font-size:13px}
  .search{width:200px}

  /* list */
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:40px}
  .row{display:grid;grid-template-columns:62px 1.6fr 60px 1.3fr 140px 180px;align-items:center;gap:10px;padding:7px 14px;border-top:1px solid var(--line)}
  .row.head{border-top:0;background:var(--head);font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:9px;padding-bottom:9px}
  .row:not(.head):hover{background:var(--hover)}
  .rank{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .row:not(.head) .rank.top{color:var(--accent)}
  .last{font-weight:700;font-size:13.5px}
  .nick{font-weight:600;color:var(--accent)}
  .detail{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:2px}
  .gen{font-size:12.5px;color:var(--muted)}
  .cat{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap}
  .cat .detail,.meta .detail{display:inline;margin:0;overflow:hidden;text-overflow:ellipsis}
  .age{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
  .votes{display:flex;gap:6px}
  .thumb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 8px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;min-width:58px;justify-content:center;transition:transform .08s,background .15s,border-color .15s}
  .thumb svg{width:14px;height:14px;flex:none}
  .thumb.down svg{transform:rotate(180deg) scaleX(-1)}
  .thumb.up:hover:not(:disabled){background:var(--up-soft);border-color:#a8dcbc;color:var(--up)}
  .thumb.down:hover:not(:disabled){background:var(--down-soft);border-color:#efb1b1;color:var(--down)}
  .thumb:active:not(:disabled){transform:scale(.94)}
  .thumb.chosen.up{background:var(--up);border-color:var(--up);color:#fff}
  .thumb.chosen.down{background:var(--down);border-color:var(--down);color:#fff}
  .thumb:disabled:not(.chosen){opacity:.45;cursor:default}
  .thumb:disabled.chosen{cursor:default}
  .chart{display:flex;flex-direction:column;gap:4px;min-width:0}
  .bar{height:8px;border-radius:99px;background:var(--down);overflow:hidden;display:flex}
  .bar.bar-none{background:var(--track)}
  .bar-up{display:block;height:100%;background:var(--up)}
  .chart-txt{font-size:11.5px;color:var(--muted);line-height:1.2;white-space:nowrap}
  .chart-txt b{color:var(--ink);font-size:12.5px}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  @media (max-width:860px){
    .row.head{display:none}
    .row{grid-template-columns:30px 1fr 120px;grid-template-areas:"rank name chart" "rank meta chart" "rank votes votes";row-gap:6px;padding:10px 12px}
    .rank{grid-area:rank;align-self:start;padding-top:2px}
    .namecell{grid-area:name}
    .meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:13px}
    .row .gen,.row .cat{display:none}
    .votes{grid-area:votes}
    .chart{grid-area:chart;align-self:start}
    .search{width:100%}
    .tools-right{width:100%}
    .tools-right .search{flex:1}
  }
  @media (min-width:861px){ .meta{display:none} }

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:grid;place-items:center;padding:16px;z-index:50}
  .modal[hidden]{display:none}
  .dialog{background:var(--card);border-radius:18px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
  .dialog.wide{max-width:760px}
  .dialog h2{margin:0 0 4px;font-size:19px;letter-spacing:-.02em}
  .dialog .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
  .x{position:absolute;top:14px;right:14px;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:6px;border-radius:8px}
  .x:hover{background:var(--hover)}
  .oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--field);font-weight:700;margin-bottom:10px}
  .oauth:hover{background:var(--hover)}
  .oauth.fb{background:#1877f2;border-color:#1877f2;color:#fff}
  .oauth.fb:hover{background:#1468d8}
  .oauth svg{width:20px;height:20px}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .field{margin-bottom:14px}
  .field label.l{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
  .field input[type=text],.field input[type=email],.field input[type=number],.field input[type=date],.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--field)}
  .field input:focus,.field select:focus,.search:focus,.sort:focus{outline:2px solid #b9cff0;border-color:var(--accent)}
  .seg{display:flex;gap:8px}
  .seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-weight:600;cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
  .check input{margin-top:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .err{color:var(--down);font-size:13px;min-height:18px;margin:4px 0 8px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .small{font-size:12.5px;color:var(--muted)}

  /* admin table */
  .atable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
  .atable th,.atable td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}
  .atable th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:0}
  .atable td:last-child{text-align:right;white-space:nowrap}
  .atable tr.pending td{background:var(--demo-bg)}
  .pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--demo-line);color:var(--demo-ink)}
  .atable .btn{padding:4px 9px;font-size:12.5px}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .admin-grid .field{margin-bottom:10px}
  .box{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .box h3{margin:0 0 10px;font-size:15px}
  @media (max-width:640px){.admin-grid,.row2{grid-template-columns:1fr}}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--onink);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--down)}
  footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 0 30px}

  /* ---------- séria grafov (validované pre CVD) ---------- */
  :root{--s1:#0b4ea2;--s2:#e8590c;--s3:#7048e8}
  [data-theme="dark"]{--s1:#4c8dff;--s2:#e06a12;--s3:#9a7bf5}

  /* navigácia */
  .nav{background:var(--card);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:center;gap:4px;height:44px;overflow-x:auto}
  .nav a{padding:6px 12px;border-radius:8px;font-weight:700;font-size:13.5px;color:var(--muted);text-decoration:none;white-space:nowrap}
  .nav a:hover{background:var(--hover);color:var(--ink)}
  .nav a.on{background:var(--accent-soft);color:var(--accent)}
  .nav .spacer{flex:1}
  .sponsor-btn{border:1px solid #e9c46a;background:linear-gradient(135deg,#fff4d6,#ffe6a8);color:#6b4a00;border-radius:99px;padding:5px 12px;font-weight:800;font-size:12.5px;white-space:nowrap;flex:none}
  .sponsor-btn:hover{filter:brightness(.97)}
  [data-theme="dark"] .sponsor-btn{background:#3a2f10;border-color:#6b5520;color:#f6d77a}
  .bell{position:relative}
  .bell .dot{position:absolute;top:-5px;right:-5px;background:var(--down);color:#fff;font-size:10px;font-weight:800;min-width:16px;height:16px;border-radius:99px;display:grid;place-items:center;padding:0 4px;line-height:1}
  a.chip{text-decoration:none;display:inline-block}

  /* oznámenia */
  .ann-banner{margin:14px 0 0;padding:10px 14px;border-radius:11px;background:var(--accent-soft);border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
  .ann-banner.sutaz{background:var(--demo-bg);border-color:var(--demo-line)}
  .ann-banner.dolezite{background:var(--down-soft)}
  .ann-banner .t,.ann .t{font-weight:800}
  .ann-banner .b,.ann .b{font-size:13px;white-space:pre-line;margin-top:2px}
  .ann-banner .spacer{flex:1}
  .ann-banner .btn{padding:4px 10px;font-size:12.5px}
  .ann{border-top:1px solid var(--line);padding:12px 0}
  .ann:first-of-type{border-top:0}
  .ann .when{font-size:11.5px;color:var(--muted)}
  .ann.unread .t::after{content:"nové";margin-left:8px;font-size:10px;background:var(--down);color:#fff;padding:1px 6px;border-radius:99px;vertical-align:middle}
  .ann .actions{justify-content:flex-start}
  .ann .btn{padding:3px 9px;font-size:12px}

  /* dôvera – zoznam */
  .row.trow{grid-template-columns:24px 58px 1fr 222px 180px}
  .trow .chart-txt{white-space:normal}
  .thumb.unk{min-width:0;padding:4px 9px;font-weight:800}
  .thumb.unk .qm{font-size:13px;line-height:1}
  .thumb.unk:hover:not(:disabled){background:var(--hover);border-color:#b8bfcc;color:var(--ink)}
  .thumb.chosen.unk{background:#8a94a6;border-color:#8a94a6;color:#fff}
  .realname{display:block;font-weight:500;font-size:11.5px;color:var(--muted);margin-top:1px}
  .hot{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#ffe8d9;color:#b4380a;margin-right:4px}
  [data-theme="dark"] .hot{background:#3d2112;color:#ff9b66}
  .clike{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:1px 9px;font-size:12px;font-weight:700;color:var(--muted)}
  .clike:hover:not(:disabled){border-color:var(--up);color:var(--up)}
  .clike.on{background:var(--up-soft);border-color:var(--up);color:var(--up)}
  .clike:disabled{cursor:default;opacity:.8}
  .trow .namecell{cursor:pointer;min-width:0}
  .trow .namecell:hover .last{text-decoration:underline}
  .trow .detail{display:block}
  .cmp{width:16px;height:16px;accent-color:var(--accent);margin:0;cursor:pointer}
  .thumb.tog:disabled{opacity:.6}
  .cmpbar{position:sticky;bottom:12px;z-index:5;background:var(--ink);color:var(--onink);border-radius:12px;padding:8px 12px;margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;box-shadow:var(--shadow)}
  .cmpbar .btn{padding:5px 10px}
  .cmpbar .btn.ghost{color:var(--onink);opacity:.8}
  @media (max-width:860px){
    .row.trow{grid-template-columns:24px 1fr 120px;grid-template-areas:"cmp name chart" "cmp votes votes"}
    .trow .cmpc{grid-area:cmp;align-self:start;padding-top:2px}
    .trow .rank{display:none}
  }

  /* dôvera – detail */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin:16px 0}
  .panel h3{margin:0;font-size:15px}
  .dhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dhead .spacer{flex:1}
  a.btn{text-decoration:none;display:inline-block}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:14px 0 18px}
  .tcard{border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
  .tc-top{display:flex;align-items:center;gap:8px}
  .tc-top b{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tc-top .x2{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
  .tc-top .x2:hover{background:var(--hover);color:var(--ink)}
  .sw{width:12px;height:12px;border-radius:3px;flex:none;display:inline-block}
  .tc-mid{display:flex;align-items:baseline;gap:8px;margin:8px 0 6px}
  .big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .dtools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-bottom:10px}
  .seg-sm{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
  .seg-sm button{border:0;background:var(--card);padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--muted)}
  .seg-sm button+button{border-left:1px solid var(--line)}
  .seg-sm button.on{background:var(--ink);color:var(--onink)}
  .chartbox{position:relative;min-height:120px;touch-action:pan-y}
  .chartbox svg{display:block}
  .chartbox text{font-size:11px;fill:var(--muted);font-family:inherit}
  .tip{position:absolute;top:8px;pointer-events:none;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:9px;padding:7px 10px;font-size:12px;min-width:170px;z-index:2}
  .tip .h{font-weight:800;margin-bottom:4px}
  .tip .r{display:flex;gap:6px;align-items:center;white-space:nowrap;margin-top:2px}
  .tip .r .sw{width:9px;height:9px}
  .tip .me{color:var(--muted);margin-top:4px;border-top:1px solid var(--line);padding-top:4px}
  .chart-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px;align-items:center}
  .chart-legend span{display:inline-flex;align-items:center;gap:6px}
  .mylog{font-size:12.5px;color:var(--muted);margin-top:10px}
  .mylog li{margin:2px 0}
  .bd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px 28px}
  .bd h4{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .bdr{display:grid;grid-template-columns:110px 1fr 86px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
  .bdr .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .bdr .v b{color:var(--ink)}

  /* ankety */
  .poll{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 150px 190px;gap:14px;align-items:center}
  .poll:first-child{border-top:0}
  .poll .q{font-weight:700;font-size:14.5px}
  .poll .d{font-size:12.5px;color:var(--muted);margin-top:2px}
  .poll.closed{opacity:.7}

function rankMoves(list, prevMap, sorter){

    age:   (a, b) => (ageOf(b) ?? -1) - (ageOf(a) ?? -1),
  }[state.sort];
  return [...list].sort((a, b) => by(a, b) || collator.compare(sortKey(a), sortKey(b)) || collator.compare(a.first_name || '', b.first_name || ''));
}

const secPersons = () => state.persons.filter(p => secOf(p) === state.psec);
function renderChips(){
  const S = SEC[state.psec], all = secPersons();
  $('#psTitle').textContent = S.title; $('#psIntro').textContent = S.intro;
  const counts = {}; all.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  if (state.cat !== 'all' && !counts[state.cat]) state.cat = 'all';
  const cats = [...S.cats, ...Object.keys(counts).filter(c => !S.cats.includes(c))].filter(c => counts[c]);
  const lead = (lst) => { const by = [...lst].sort((a, b) => (b.up - b.down) - (a.up - a.down) || (b.up + b.down) - (a.up + a.down)); return by[0] && (by[0].up + by[0].down) ? by[0] : null; };
  const L = lead(all), LC = state.cat !== 'all' ? lead(all.filter(p => p.category === state.cat)) : null;
  $('#psLeader').innerHTML = L ? `<div class="leader">🏆 <span>Priebežne vedie: <b>${esc(fullName(L))}</b> (skóre ${L.up - L.down > 0 ? '+' : ''}${L.up - L.down})${LC ? ` · v kategórii ${esc(state.cat)}: <b>${esc(fullName(LC))}</b>` : ''}</span></div>` : '';
  $('#chips').innerHTML = `<button class="chip ${state.cat === 'all' ? 'on' : ''}" data-cat="all">Všetci<span class="n">${all.length}</span></button>` +
    cats.map(c => `<button class="chip ${state.cat === c ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${counts[c]}</span></button>`).join('');
}

function renderList(){
  const q = state.q.trim().toLocaleLowerCase('sk');
  const list = sorted(secPersons().filter(p =>
    (state.cat === 'all' || p.category === state.cat) &&
    (!q || `${p.last_name || ''} ${p.first_name || ''} ${p.nickname || ''} ${p.detail || ''}`.toLocaleLowerCase('sk').includes(q))));
  const head = `<div class="row head"><div>#</div><div>Prezývka · Priezvisko Meno</div><div>Pohlavie</div><div>${state.psec === 'influencer' ? 'Kategória · siete' : 'Kategória'}</div><div>Hlasuj</div><div>Pomer</div></div>`;
  if (!list.length){ $('#list').innerHTML = head + `<div class="empty">Nenašli sa žiadne ${SEC[state.psec].many}.</div>`; return; }
  const moves = state.sort === 'name' ? new Map() : rankMoves(list, state.personPrev, sorted);
  const plat = p => (p.platforms || []).map(x => `<span class="plat">${esc(x)}</span>`).join('');
  $('#list').innerHTML = head + list.map((p, i) => {
    const mine = state.myVotes.get(p.id);
    const locked = !isAdmin() && mine !== undefined;
    const t = p.up + p.down;
    const pct = t ? Math.round(p.up / t * 100) : null;
    const age = ageOf(p);
    return `<div class="row">
      <div class="rank ${i < 3 && state.sort === 'score' ? 'top' : ''}">${i + 1}.${moveArrow(moves.get(p.id))}</div>
      <div class="namecell">${nameHTML(p)}</div>
      <div class="gen">${genderLabel(p)}</div>
      <div class="cat"><span class="tag">${esc(p.category)}</span>${plat(p)}${p.detail && state.psec !== 'influencer' ? `<span class="detail">${esc(p.detail)}</span>` : ''}</div>
      <div class="meta"><span>${genderLabel(p)}</span><span class="tag">${esc(p.category)}</span>${plat(p)}${p.detail && state.psec !== 'influencer' ? `<span class="detail">${esc(p.detail)}</span>` : ''}</div>
      <div class="votes">
        <button class="thumb up ${mine === 1 ? 'chosen' : ''}" data-vote="1" data-id="${p.id}" ${locked ? 'disabled' : ''} title="Páči sa mi" aria-label="Palec hore pre ${esc(fullName(p))}">${ICON_THUMB}<span>${p.up}</span></button>
        <button class="thumb down ${mine === -1 ? 'chosen' : ''}" data-vote="-1" data-id="${p.id}" ${locked ? 'disabled' : ''} title="Nepáči sa mi" aria-label="Palec dole pre ${esc(fullName(p))}">${ICON_THUMB}<span>${p.down}</span></button>
      </div>
      <div class="chart">${bar(p.up, p.down)}<div class="chart-txt">${pct === null ? 'bez hlasov' : `<b>${pct} %</b> · ${t} ${t === 1 ? 'hlas' : (t < 5 ? 'hlasy' : 'hlasov')}`}</div></div>
    </div>`;
  }).join('');
}

async function loadPersons(){
  state.persons = (await api.listPersons()).map(p => ({ ...p, id: Number(p.id), section: secOf(p), platforms: p.platforms || [] }));
  api.personPrev().then(r => { state.personPrev = new Map(r.map(x => [Number(x.person_id), x])); if (state.tab === 'masrad') renderList(); }).catch(() => {});
}
async function loadAuth(){
  state.user = await api.getUser();
  state.profile = state.user ? await api.getProfile(state.user.id) : null;
  state.myVotes = new Map();
  if (state.user && state.profile){
    (await api.myVotes(state.user.id)).forEach(v => state.myVotes.set(Number(v.person_id), v.value));
  }
  state.myTrust = new Map(); state.myPolls = new Map(); state.miss = null;
  if (state.user && state.profile){
    const [t, pv] = await Promise.all([api.myTrust(state.user.id).catch(() => []), api.myPolls(state.user.id).catch(() => [])]);
    t.forEach(v => state.myTrust.set(Number(v.item_id), v.value));
    pv.forEach(v => state.myPolls.set(Number(v.poll_id), v.value));
  }
}

// dvojklikové potvrdenie (alert/confirm v prehliadači nepoužívame)
function confirmClick(btn, label){
  if (btn.dataset.armed){ return true; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label || 'Naozaj? Kliknite znova';
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; } }, 3500);
  return false;
}

async function onVote(btn){
  const pid = Number(btn.dataset.id), value = Number(btn.dataset.vote);
  if (!state.user) return openLogin();
  if (!state.profile) return openProfile();
  if (!isAdmin() && state.myVotes.has(pid)) return toast('Za túto osobnosť ste už hlasovali.', true);
  btn.disabled = true;
  try {
    await api.vote(state.user.id, isAdmin(), pid, value);
    const p = state.persons.find(x => x.id === pid);
    value === 1 ? p.up++ : p.down++;
    if (!isAdmin()) state.myVotes.set(pid, value);
    renderList();
    toast(value === 1 ? '👍 Hlas zaznamenaný' : '👎 Hlas zaznamenaný');
  } catch(err){
    toast(err.message, true); btn.disabled = false;
  }
}

/* ---------- spoločný výpočet časovej osi (demo) ---------- */
function computeTimeline(events, ids, days){
  const today = todayUTC();
  const evs = events.filter(e => ids.includes(e.item_id)).sort((a, b) => a.created_at < b.created_at ? -1 : a.created_at > b.created_at ? 1 : 0);
  let start = addDays(today, -(Math.min(Math.max(days || 90, 1), 3650) - 1));
  const first = evs.length ? evs[0].created_at.slice(0, 10) : today;
  if (first > start) start = first;
  const out = [];
  for (const id of ids){
    const mine = evs.filter(e => e.item_id === id); const cur = new Map(); let j = 0;
    for (let d = start; d <= today; d = addDays(d, 1)){
      while (j < mine.length && mine[j].created_at.slice(0, 10) <= d){ cur.set(mine[j].user_id, mine[j].value); j++; }
      let up = 0, down = 0; cur.forEach(v => { if (v === 1) up++; else if (v === -1) down++; });
      out.push({ item_id:id, day:d, up, down });
    }
  }
  return out;
}

function markNav(key){ document.querySelectorAll('.nav a[data-tab]').forEach(a => a.classList.toggle('on', a.dataset.tab === key)); }
const KIND_Q = { politik:'Dôverujete politikom?', strana:'Dôverujete politickým stranám?', novinar:'Považujete ich za objektívnych?', media:'Dôverujete médiám?', institucia:'Dôverujete inštitúciám?' };
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  const tab = (h.startsWith('dovera') || h.startsWith('d-')) ? 'dovera' : (h === 'ankety' || h.startsWith('anketa-')) ? 'ankety' : (h === 'clanky' || h.startsWith('clanok-')) ? 'clanky' : (h === 'miss' || h.startsWith('miss-')) ? 'miss' : 'masrad';
  state.tab = tab;
  if (tab === 'masrad'){ const sec = h === 'influenceri' ? 'influencer' : 'osobnost'; if (sec !== state.psec){ state.psec = sec; state.cat = 'all'; } markNav(SEC[sec].nav); renderChips(); renderList(); }
  else if (tab !== 'dovera') markNav(tab);
  ['masrad', 'dovera', 'ankety', 'miss', 'clanky'].forEach(t => { $('#view-' + t).hidden = t !== tab; });
  $('#footer').textContent = FOOT[tab];
  if (tab === 'dovera'){
    if (h === 'dovera-media') state.tkind = 'media';
    else if (h === 'dovera-strany') state.tkind = 'strana';
    else if (h === 'dovera-novinari') state.tkind = 'novinar';
    else if (h === 'dovera-institucie') state.tkind = 'institucia';
    else if (h === 'dovera') state.tkind = 'politik';
    markNav(state.tkind);
    state.detailIds = h.startsWith('d-') ? [...new Set(h.slice(2).split('-').map(Number).filter(Boolean))].slice(0, 3) : null;
    showDovera();
  } else if (tab === 'ankety'){ markNav('ankety'); state.pollId = h.startsWith('anketa-') ? Number(h.slice(7)) || null : null; showAnkety(); window.scrollTo(0, 0); }
  else if (tab === 'clanky'){ state.articleId = h.startsWith('clanok-') ? Number(h.slice(7)) || null : null; showClanky(); window.scrollTo(0, 0); }
  else if (tab === 'miss') showMiss(h.startsWith('miss-') ? Number(h.slice(5)) : null);
}

function trustSorted(list){
  const ratio = p => (p.up + p.down) ? p.up / (p.up + p.down) : -1;
  const few = p => (p.up + p.down) < TRUST_MIN ? 1 : 0;
  const by = {
    ratio: (a, b) => few(a) - few(b) || ratio(b) - ratio(a) || (b.up + b.down) - (a.up + a.down),
    votes: (a, b) => (b.up + b.down) - (a.up + a.down),
    name: () => 0
  }[state.tsort] || ((a, b) => few(a) - few(b) || ratio(b) - ratio(a));
  return [...list].sort((a, b) => by(a, b) || collator.compare(a.name, b.name));
}
function trustThumbs(i){
  const mine = state.myTrust.get(i.id) || 0;
  const t = (v, cls, lbl) => `<button class="thumb tog ${cls} ${mine === v ? 'chosen' : ''}" data-tvote="${v}" data-id="${i.id}" title="${mine === v ? 'Kliknite znova pre zrušenie hlasu' : lbl}" aria-pressed="${mine === v}" aria-label="${lbl}: ${esc(i.name)}">${ICON_THUMB}<span>${v === 1 ? i.up : i.down}</span></button>`;
  const u = `<button class="thumb tog unk ${mine === 2 ? 'chosen' : ''}" data-tvote="2" data-id="${i.id}" title="${mine === 2 ? 'Kliknite znova pre zrušenie' : 'Nepoznám'}" aria-pressed="${mine === 2}" aria-label="Nepoznám: ${esc(i.name)}"><span class="qm">?</span></button>`;
  const T = TERM(i.kind);
  return t(1, 'up', T.up) + t(-1, 'down', T.down) + u;
}

async function loadTimeline(){
  const ids = state.detailIds; const box = $('#tl'); if (!box) return;
  try {
    const [rows, evs] = await Promise.all([api.trustTimeline(ids, state.days), state.user ? api.myTrustEvents(state.user.id, ids).catch(() => []) : []]);
    state.tl = { ids, rows: rows.map(r => ({ ...r, item_id: Number(r.item_id) })), evs: evs.map(e => ({ ...e, item_id: Number(e.item_id) })) };
    drawTimeline();
  } catch(err){ box.innerHTML = `<div class="empty">Graf sa nepodarilo načítať: ${esc(err.message)}</div>`; }
}
function drawTimeline(){
  const box = $('#tl'); if (!box || !state.tl) return;
  const { ids, rows, evs } = state.tl;
  const days = [...new Set(rows.map(r => r.day))].sort();
  if (!days.length){ box.innerHTML = '<div class="empty">Zatiaľ bez hlasov.</div>'; return; }
  const W = Math.max(280, box.clientWidth), H = 250, m = { l:42, r:14, t:12, b:26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = days.length;
  const X = i => m.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const Y = p => m.t + ih - p / 100 * ih;
  const idx = new Map(days.map((d, i) => [d, i]));
  const series = ids.map((id, k) => {
    const pts = new Array(n).fill(null);

    svg += `<rect x="${x - 5}" y="${y - 5}" width="10" height="10" transform="rotate(45 ${x} ${y})" fill="var(--card)" stroke="var(--s${k + 1})" stroke-width="2.5"/>`;
  });
  svg += `<line id="tlx" x1="0" x2="0" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>`;

      + (mine.length ? `<div class="me">${mine.map(e => `◆ ${new Date(e.created_at).toLocaleTimeString('sk-SK', { hour:'2-digit', minute:'2-digit' })} ${ACT(e.value)}${ids.length > 1 ? ' · ' + esc(state.trustById.get(e.item_id)?.name || '') : ''}`).join('<br>')}</div>` : '');

async function onPollAdmin(t){
  const d = t.dataset, id = Number(d.papprove || d.pnow || d.preject || d.pback || d.puseai || d.pend || d.pext || 0);
  if (!id) return false;
  const q = state.polls.find(x => x.id === id); if (!q) return true;
  const dur = Number($('#pdur_' + id)?.value || q.duration_days || 7), now = new Date().toISOString();
  let patch, msg;
  if (d.papprove){ patch = { status:'schvalena', decided_at: now, duration_days: dur }; msg = 'Schválené – AI ju zverejní v najvhodnejšom čase.'; }
  else if (d.pnow){ patch = { status:'aktivna', decided_at: q.decided_at || now, published_at: now, ends_at: plusDays(dur), duration_days: dur }; msg = 'Anketa zverejnená.'; }
  else if (d.preject){ patch = { status:'zamietnuta', decided_at: now }; msg = 'Presunuté do archívu.'; }
  else if (d.pback){ patch = { status:'na_schvalenie', decided_at: null, scheduled_at: null }; msg = 'Vrátené na schválenie.'; }

  else if (d.pend){ patch = { ends_at: now }; msg = 'Anketa ukončená – výsledok je teraz verejný.'; }

  return true;
}
const plSk = (n, one, few, many) => n === 1 ? one : (n >= 2 && n <= 4 ? few : many);
function relTime(iso){
  const d = (Date.parse(iso) - Date.now()) / 1000, a = Math.abs(d), fut = d > 0;
  const m = a / 60, h = m / 60;
  const f = (n, o1, o2, o5, p1, p2) => fut ? `o ${n === 1 ? '' : n + ' '}${plSk(n, o1, o2, o5)}`.replace('o  ', 'o ') : `pred ${n === 1 ? '' : n + ' '}${n === 1 ? p1 : p2}`;
  if (m < 1) return fut ? 'o chvíľu' : 'pred chvíľou';
  if (h < 1){ const n = Math.max(1, Math.round(m)); return f(n, 'minútu', 'minúty', 'minút', 'minútou', 'minútami'); }
  if (h < 24){ const n = Math.max(1, Math.round(h)); return f(n, 'hodinu', 'hodiny', 'hodín', 'hodinou', 'hodinami'); }
  const dd = Math.round(h / 24);
  if (dd === 1) return fut ? 'zajtra' : 'včera';
  if (dd < 7) return f(dd, 'deň', 'dni', 'dní', 'dňom', 'dňami');
  if (dd < 30){ const n = Math.round(dd / 7); return f(n, 'týždeň', 'týždne', 'týždňov', 'týždňom', 'týždňami'); }
  if (dd < 365){ const n = Math.round(dd / 30); return f(n, 'mesiac', 'mesiace', 'mesiacov', 'mesiacom', 'mesiacmi'); }
  const n = Math.round(dd / 365); return f(n, 'rok', 'roky', 'rokov', 'rokom', 'rokmi');
}
function pollWhen(q){
  const start = q.published_at || q.created_at, exact = `${fmtD(start)}${q.ends_at ? ' – ' + fmtD(q.ends_at) : ''}`;
  if (pollEnded(q)) return `<span class="pdates" title="${exact}">Skončila ${relTime(q.ends_at)}</span>`;
  const soon = q.ends_at && Date.parse(q.ends_at) - Date.now() < 864e5;
  return `<span class="pdates" title="${exact}">Začala ${relTime(start)}${q.ends_at ? ` · <span class="${soon ? 'soon' : ''}">končí ${relTime(q.ends_at)}</span>` : ''}</span>`;
}

function donutSVG(o){
  const up = o.up || 0, down = o.down || 0, t = up + down, unk = o.unknown || 0;
  const R = 70, C = 2 * Math.PI * R, GAP = up && down ? 3 : 0;
  const pUp = t ? up / t : 0, lenUp = Math.max(0, pUp * C - GAP), lenDn = Math.max(0, (1 - pUp) * C - GAP);
  const ring = (len, off, col) => `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;
  const [l1, l2] = o.labels || ['Áno', 'Nie'];
  if (!t) return `<div class="donut"><svg viewBox="0 0 180 180" style="width:${o.size || 170}px;height:${o.size || 170}px" role="img" aria-label="Zatiaľ bez hlasov"><circle cx="90" cy="90" r="${R}" fill="none" stroke="var(--track)" stroke-width="22"/><text x="90" y="96" text-anchor="middle" class="c-big">–</text></svg><div class="hint">Zatiaľ bez hlasov.</div></div>`;
  const pct = Math.round(pUp * 100), known = t + unk ? Math.round(t / (t + unk) * 100) : null;
  return `<div class="donut"><svg viewBox="0 0 180 180" style="width:${o.size || 170}px;height:${o.size || 170}px" role="img" aria-label="${pct} % ${esc(o.sub || l1)}, ${hlasov(t)}">
      ${up ? ring(lenUp, GAP / 2, 'var(--up)') : ''}${down ? ring(lenDn, pUp * C + GAP / 2, 'var(--down)') : ''}
      <text x="90" y="96" text-anchor="middle" class="c-big">${pct} %</text><text x="90" y="116" text-anchor="middle" class="c-small">${esc(o.sub || l1.toLowerCase())}</text></svg>
    <div class="dleg"><div><span class="sw" style="background:var(--up)"></span>${esc(l1)}<b>${up}</b></div><div><span class="sw" style="background:var(--down)"></span>${esc(l2)}<b>${down}</b></div>${unk ? `<div><span class="sw" style="background:var(--track)"></span>Nepozná<b>${unk}</b></div><div class="tot">pozná ${known} % hlasujúcich</div>` : `<div class="tot">${hlasov(t)}</div>`}</div></div>`;
}
function pollDonut(q, shown){

  const R = 70, C = 2 * Math.PI * R, GAP = t && up && down ? 3 : 0;
  const pUp = t ? up / t : 0, lenUp = Math.max(0, pUp * C - GAP), lenDn = Math.max(0, (1 - pUp) * C - GAP);
  const ring = (len, off, col) => `<circle cx="90" cy="90" r="${R}" fill="none" stroke="${col}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"/>`;
  if (!shown || !t){

      <text x="90" y="92" text-anchor="middle" class="c-big">?</text><text x="90" y="114" text-anchor="middle" class="c-small">${hlasov(total)}</text></svg><div class="hint">${msg}</div></div>`;
  }
  const pct = Math.round(pUp * 100);
  return `<div class="donut"><svg viewBox="0 0 180 180" role="img" aria-label="${pct} % áno, ${100 - pct} % nie, ${hlasov(t)}">
      ${up ? ring(lenUp, GAP / 2, 'var(--up)') : ''}${down ? ring(lenDn, pUp * C + GAP / 2, 'var(--down)') : ''}
      <text x="90" y="96" text-anchor="middle" class="c-big">${pct} %</text><text x="90" y="116" text-anchor="middle" class="c-small">áno</text></svg>
    <div class="dleg"><div><span class="sw" style="background:var(--up)"></span>Áno<b>${pct} %</b></div><div><span class="sw" style="background:var(--down)"></span>Nie<b>${100 - pct} %</b></div><div class="tot">${hlasov(t)}</div></div></div>`;
}

const ART_KIND = { anketa:'Vyhodnotenie ankety', dovera:'Dôvera', ine:'Článok' };
function wrapWords(text, max){
  const out = []; let line = '';
  String(text || '').split(/\s+/).forEach(w => { if ((line + ' ' + w).trim().length > max && line){ out.push(line); line = w; } else line = (line + ' ' + w).trim(); });
  if (line) out.push(line); return out;
}
function coverSVG(a, w, h, forFile){
  const st = a.stats || {}, col = st.color === 'down' ? ['#b3261e', '#7a1712'] : st.color === 'up' ? ['#1b7a43', '#0f5130'] : ['#0b4ea2', '#08306a'];
  const tall = h > w, big = st.big || '', label = st.label || '', font = forFile ? 'Arial, Helvetica, sans-serif' : 'Manrope, system-ui, sans-serif';
  const tLines = wrapWords(a.title, tall ? 22 : 34).slice(0, tall ? 5 : 3), lLines = wrapWords(label, tall ? 26 : 40).slice(0, 2);
  const pad = w * 0.07, bigSize = tall ? 230 : 120, titleSize = tall ? 62 : 40;
  let y = tall ? h * 0.2 : h * 0.24;
  const kicker = `<text x="${pad}" y="${tall ? 110 : 70}" font-family="${font}" font-size="${tall ? 34 : 24}" font-weight="800" fill="#fff" opacity=".85" letter-spacing="2">VEREJNÁ MIENKA · ${esc((ART_KIND[a.kind] || '').toUpperCase())}</text>`;
  let body = '';
  if (big){ body += `<text x="${pad}" y="${y + bigSize * 0.8}" font-family="${font}" font-size="${bigSize}" font-weight="800" fill="#fff">${esc(big)}</text>`; y += bigSize * 0.95;
    lLines.forEach(l => { body += `<text x="${pad}" y="${y + 40}" font-family="${font}" font-size="${tall ? 44 : 28}" font-weight="700" fill="#fff" opacity=".92">${esc(l)}</text>`; y += tall ? 56 : 36; }); y += tall ? 50 : 18; }
  else y += tall ? 60 : 20;
  tLines.forEach(l => { body += `<text x="${pad}" y="${y + titleSize}" font-family="${font}" font-size="${titleSize}" font-weight="800" fill="#fff">${esc(l)}</text>`; y += titleSize * 1.2; });
  const foot = `<text x="${pad}" y="${h - pad * (tall ? 0.9 : 0.6)}" font-family="${font}" font-size="${tall ? 30 : 20}" font-weight="700" fill="#fff" opacity=".8">masrad.porovnajsa.sk</text>`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${forFile ? w : '100%'}" ${forFile ? `height="${h}"` : ''} preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(a.title)}">
    <defs><linearGradient id="g${a.id}${w}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${col[0]}"/><stop offset="1" stop-color="${col[1]}"/></linearGradient></defs>
    <rect width="${w}" height="${h}" fill="url(#g${a.id}${w})"/><circle cx="${w * 0.92}" cy="${h * 0.12}" r="${Math.min(w, h) * 0.32}" fill="#fff" opacity=".06"/><circle cx="${w * 0.98}" cy="${h * 0.95}" r="${Math.min(w, h) * 0.22}" fill="#fff" opacity=".05"/>
    ${kicker}${body}${foot}</svg>`;
}
async function downloadCover(id){
  const a = state.articles.find(x => x.id === id); if (!a) return;
  const svg = coverSVG(a, 1080, 1350, true);
  const img = new Image(); const url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml' }));
  img.onload = () => { const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; c.getContext('2d').drawImage(img, 0, 0); URL.revokeObjectURL(url);
    c.toBlob(b => { const l = document.createElement('a'); l.href = URL.createObjectURL(b); l.download = `verejna-mienka-${id}.png`; l.click(); setTimeout(() => URL.revokeObjectURL(l.href), 2000); }, 'image/png'); };
  img.onerror = () => toast('Obrázok sa nepodarilo vytvoriť.', true);

}

      store.set(K.c, l); store.set(K.set, { ...st, current_round: st.current_round + 1, group_size: size, eliminate_count: elim, round_ends_at: ends });

function liveMiss(sb, chk){
  return {
    async missSettings(){ return chk(await sb.from('miss_settings').select('*').eq('id', 1).single()); },
    async missSaveSettings(s){ chk(await sb.from('miss_settings').update(s).eq('id', 1)); },
    async missBoard(){ return chk(await sb.from('miss_board').select('*')); },
    async missProfile(id){ return chk(await sb.from('miss_profiles').select('*').eq('id', id).maybeSingle()); },
    async myMissVotes(uid, round){ return chk(await sb.from('miss_votes').select('contestant_id,group_no,votes,paid,created_at').eq('round', round)); },
    async missVote(uid, id, credits){ return chk(await sb.rpc('miss_vote', { p_contestant:id, p_credits:credits || 0 })); },
    async myContestant(uid){ return chk(await sb.from('miss_contestants').select('*').eq('user_id', uid).maybeSingle()); },
    async saveContestant(uid, row){
      const cur = chk(await sb.from('miss_contestants').select('id').eq('user_id', uid).maybeSingle());

      if (error) throw error; return path;
    },

    async missPending(){ return chk(await sb.from('miss_contestants').select('*').eq('status', 'pending').order('created_at')); },
    async missSetStatus(id, status){ chk(await sb.from('miss_contestants').update({ status }).eq('id', id)); },
    async missNewRound(elim, size, pots, ends){ return chk(await sb.rpc('miss_new_round', { p_eliminate:elim, p_group_size:size, p_pots:pots, p_round_ends:ends })); },
    async missGrant(email, amount){ return chk(await sb.rpc('miss_grant_credits', { p_email:email, p_amount:amount })); },
    async missHistory(id){ return chk(await sb.from('miss_round_results').select('round,group_no,place,votes,advanced').eq('contestant_id', id).order('round')); },
    async missTips(){ return chk(await sb.from('miss_tips').select('id,title,body,format,created_at').eq('active', true).order('created_at', { ascending:false }).limit(6)); }
  };
}

function missCooldown(group){

  return left > 0 ? { left, contestant: Number(mine.contestant_id) } : null;

const missElim = () => { const e = Number(state.miss?.st.eliminate_count); return Number.isFinite(e) ? e : 2; };

function missPos(id){
  const c = state.miss?.board.find(x => x.id === id); if (!c) return null;
  const list = missSorted(c.group_no), rank = list.findIndex(x => x.id === id) + 1, adv = missAdvOf(list.length);
  const need = rank > adv ? list[adv - 1].votes - c.votes + 1 : 0;
  const lead = rank > adv ? 0 : (list[adv] ? c.votes - list[adv].votes : null);
  return { c, rank, size: list.length, adv, advancing: rank <= adv, need, lead };
}

function resizeImage(file, max){
  return new Promise((res, rej) => {
    const img = new Image(); img.onerror = rej;
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => b ? res(b) : rej(new Error('blob')), 'image/jpeg', 0.85); URL.revokeObjectURL(img.src); };
    img.src = URL.createObjectURL(file);
  });
}

      <div class="mpots">${places.map(i => `<label class="mpot" data-mpot-row="${i}"><span>${i}. miesto</span><select class="sort" data-mpot="${i}">${[1, 2, 3, 4, 5].map(k => `<option value="${k}" ${(i === 2 ? 2 : 1) === k ? 'selected' : ''}>kôš ${POT_L[k]}</option>`).join('')}</select></label>`).join('')}</div></div>
    <div id="nr_prev" class="box"></div>
    <div class="actions"><button type="button" class="btn" data-close>Zrušiť</button><button type="button" class="btn danger" data-act="miss-nr-go">Ukončiť kolo a vyžrebovať</button></div>`, true);
  ['#nr_size', '#nr_elim'].forEach(q => $(q).addEventListener('input', missNrPreview));
  document.querySelectorAll('[data-mpot]').forEach(el => el.addEventListener('change', missNrPreview));

}
function missNrRead(){
  const size = Math.floor(Number($('#nr_size').value)), elim = Math.floor(Number($('#nr_elim').value)), endV = $('#nr_end').value;
  if (!(size >= 2 && size <= 20)){ toast('Veľkosť skupiny musí byť 2 až 20.', true); return null; }
  if (!(elim >= 0 && elim <= 10)){ toast('Počet vypadávajúcich musí byť 0 až 10.', true); return null; }
  if (!endV || Date.parse(endV) <= Date.now()){ toast('Zadajte budúci termín konca kola.', true); return null; }
  const pots = [...document.querySelectorAll('[data-mpot]')].map(el => Number(el.value));
  return { size, elim, pots, ends: new Date(endV).toISOString() };
}
function missNrPreview(){
  const el = $('#nr_prev'); if (!el) return;
  const m = state.miss, size = Math.max(2, Math.floor(Number($('#nr_size').value)) || 5), elim = Math.max(0, Math.floor(Number($('#nr_elim').value)) || 0);
  const pots = [...document.querySelectorAll('[data-mpot]')].map(x => Number(x.value));
  const byPlace = {}; let out = 0;
  for (const g of new Set(m.board.map(c => c.group_no))){ const n = m.board.filter(c => c.group_no === g).length, keep = Math.max(n - elim, 1);
    for (let i = 1; i <= keep; i++) byPlace[i] = (byPlace[i] || 0) + 1; out += n - keep; }
  document.querySelectorAll('[data-mpot-row]').forEach(r => { r.style.opacity = byPlace[r.dataset.mpotRow] ? 1 : .35; });
  const byPot = {}; Object.entries(byPlace).forEach(([pl, n]) => { const k = pots[pl - 1] || 1; (byPot[k] ||= { n:0, pl:[] }).n += n; byPot[k].pl.push(pl + '.'); });
  const adv = Object.values(byPlace).reduce((a, b) => a + b, 0);
  const lines = Object.keys(byPot).sort().map(k => { const o = byPot[k], ng = Math.max(1, Math.ceil(o.n / size)), lo = Math.floor(o.n / ng), hi = Math.ceil(o.n / ng);
    return `<li>Kôš ${POT_L[k]} (${o.pl.join(' + ')} miesta): ${o.n} súťažiacich → ${ng} ${ng === 1 ? 'skupina' : ng < 5 ? 'skupiny' : 'skupín'} po ${lo === hi ? lo : lo + '–' + hi}</li>`; });
  el.innerHTML = `<b>Náhľad:</b> postúpi ${adv}, vypadne ${out}.<ul style="margin:6px 0 0;padding-left:18px">${lines.join('')}</ul>
    <p class="small" style="margin:6px 0 0">V koši sa najprv náhodne rozdelia 1. miesta, potom ďalšie, takže každá skupina dostane rovnomernú zmes. Žreb je náhodný a nevratný.</p>`;
}
async function onMissClick(t){
  const d = t.dataset;
  if (d.mopen){ openMissProfile(Number(d.mopen)); return true; }
  if (d.mvote){ t.disabled = true; const ok = await onMissVote(Number(d.mvote)); if (ok && d.closeAfter) closeModal(); else t.disabled = false; return true; }
  if (d.mvotecred){ const n = Math.floor(Number($('#mcred').value)); if (!(n > 0)) return true; if (await onMissVote(Number(d.mvotecred), n)) closeModal(); return true; }
  if (d.mfav){ const on = missToggleFav(Number(d.mfav)); toast(on ? 'Pridané medzi favoritky ⭐' : 'Odobrané z favoritiek.'); renderMiss(); return true; }
  if (d.mflag){ state.missFlag = state.missFlag === d.mflag ? null : d.mflag; state.missView = 'all'; renderMiss(); return true; }
  if (d.mlayout){ store.set('mr_miss_layout', d.mlayout); renderMiss(); return true; }
  if (d.mview){ state.missView = d.mview; renderMiss(); return true; }
  if (d.mshare){ const id = Number(d.mshare); try { await navigator.share({ title: state.miss.st.title, text: missShareText(id), url: missUrl(id) }); } catch {} return true; }
  if (d.mcopy){ const id = Number(d.mcopy); try { await navigator.clipboard.writeText(`${missShareText(id)}\n${missUrl(id)}`); toast('Skopírované – vlož ho kamkoľvek.'); } catch { toast('Kopírovanie nefunguje – označte text ručne.', true); } return true; }
  if (d.mpage){ state.missPage = Number(d.mpage); renderMiss(); window.scrollTo({ top: 0, behavior: 'smooth' }); return true; }
  if (d.mst){ try { await api.missSetStatus(Number(d.id), d.mst); toast(d.mst === 'approved' ? 'Schválené.' : 'Zamietnuté.'); await loadMiss(); renderMiss(); } catch(err){ toast(err.message, true); } return true; }
  switch (d.act){
    case 'miss-signup': openMissSignup(); return true;
    case 'miss-credits': openMissCredits(); return true;
    case 'miss-grant': try { const b = await api.missGrant($('#mg_e').value.trim(), Number($('#mg_a').value)); toast(`Pripísané. Zostatok: ${b} kreditov.`); await loadMiss(); renderMiss(); } catch(err){ toast(err.message, true); } return true;
    case 'miss-newround': openMissNewRound(); return true;
    case 'miss-preset-rand': document.querySelectorAll('[data-mpot]').forEach(el => { el.value = '1'; }); missNrPreview(); return true;
    case 'miss-preset-13': document.querySelectorAll('[data-mpot]').forEach(el => { el.value = el.dataset.mpot === '2' ? '2' : '1'; }); missNrPreview(); return true;
    case 'miss-preset-each': document.querySelectorAll('[data-mpot]').forEach(el => { el.value = el.dataset.mpot; }); missNrPreview(); return true;
    case 'miss-nr-go': {
      const v = missNrRead(); if (!v) return true;
      if (!confirmClick(t, 'Naozaj? Je to nevratné – kliknite znova')) return true;
      t.disabled = true;
      try { const r = await api.missNewRound(v.elim, v.size, v.pots, v.ends); closeModal(); toast(`Začalo ${r.round}. kolo: postúpilo ${r.advanced}, vypadlo ${r.eliminated}, ${r.groups} skupín.`); state.missPage = 1; await loadMiss(); renderMiss(); }
      catch(err){ toast(err.message, true); t.disabled = false; }
      return true;
    }
  }
  return false;
}

      <div class="err" id="annErr"></div><div class="actions"><button class="btn primary">Zverejniť</button></div></form>` : ''}
    ${state.anns.length ? state.anns.map(a => `<div class="ann ${a.active && !r.has(a.id) ? 'unread' : ''}"><div class="t">${ANN_ICON[a.kind] || ''} ${esc(a.title)}</div>
      <div class="when">${fmtDate(a.created_at)}${a.active ? '' : ' · skryté'}</div>${a.body ? `<div class="b">${esc(a.body)}</div>` : ''}
      ${isAdmin() ? `<div class="actions" style="margin-top:6px"><button class="btn" data-atoggle="${a.id}">${a.active ? 'Skryť' : 'Zobraziť'}</button><button class="btn danger" data-adel="${a.id}">Zmazať</button></div>` : ''}</div>`).join('') : '<p class="small">Zatiaľ žiadne oznámenia.</p>'}`);
  markRead(state.anns.map(a => a.id)); renderUser(); renderBanner();
  const f = $('#annForm');
  if (f) f.addEventListener('submit', async e => {
    e.preventDefault();
    try { await api.saveAnnouncement({ title: $('#at').value.trim(), body: $('#ab').value.trim() || null, kind: $('#ak').value, active: true }); await loadAnns(); toast('Oznámenie zverejnené.'); openAnn(); }
    catch(err){ $('#annErr').textContent = err.message; }
  });
}

/* ---------- ďalšie udalosti pre nové sekcie ---------- */
async function onExtraClick(t){
  const d = t.dataset;
  if (await onPollAdmin(t)) return true;
  if (d.ptab){ state.ptab = d.ptab; renderPolls(); return true; }
  if (await onMissClick(t)) return true;
  if (d.open){ location.hash = detailHash([Number(d.open)]); return true; }
  if (d.tvote){ onTrustVote(t); return true; }
  if (d.pvote){ onPollVote(t); return true; }
  if (d.rm){ const ids = state.detailIds.filter(x => x !== Number(d.rm)); location.hash = detailHash(ids); return true; }
  if (d.days){ state.days = Number(d.days); document.querySelectorAll('[data-days]').forEach(b => b.classList.toggle('on', b === t)); loadTimeline(); return true; }
  if (d.bd){ loadBreakdown(Number(d.bd)); return true; }
  if (d.annClose){ markRead([Number(d.annClose)]); renderUser(); renderBanner(); return true; }
  const adminAct = async (fn, msg, after) => { try { await fn(); if (msg) toast(msg); await after(); } catch(err){ toast(err.message, true); } };
  if (d.pcat){ state.pcat = d.pcat; renderPollList(); return true; }
  if (d.pcats){ openPollCats(Number(d.pcats)); return true; }
  if (d.aedit){ openArticleEdit(Number(d.aedit)); return true; }
  if (d.apub || d.arej){ const a = state.articles.find(x => x.id === Number(d.apub || d.arej));
    try { await api.saveArticle({ id: a.id, status: d.apub ? 'publikovany' : 'zamietnuty', published_at: d.apub ? (a.published_at || new Date().toISOString()) : a.published_at }); state.articles = null; await showClanky(); toast(d.apub ? 'Článok zverejnený.' : 'Článok skrytý.'); } catch(err){ toast(err.message, true); }
    return true; }
  if (d.adelart){ if (!confirmClick(t, 'Naozaj zmazať?')) return true; try { await api.deleteArticle(Number(d.adelart)); state.articles = null; location.hash = '#clanky'; showClanky(); toast('Článok zmazaný.'); } catch(err){ toast(err.message, true); } return true; }
  if (d.apng){ downloadCover(Number(d.apng)); return true; }
  if (d.acopy){ const a = state.articles.find(x => x.id === Number(d.acopy)); try { await navigator.clipboard.writeText(a.social || ''); toast('Skopírované.'); } catch { toast('Kopírovanie nefunguje – označte text ručne.', true); } return true; }
  if (d.phot){ const q = state.polls.find(x => x.id === Number(d.phot)); try { await api.savePoll({ id: q.id, hot: !q.hot }); state.polls = null; await showAnkety(); toast(q.hot ? 'Označenie zrušené.' : 'Označené ako horúca téma.'); } catch(err){ toast(err.message, true); } return true; }
  if (d.clike){ if (!state.user){ openLogin(); return true; } t.disabled = true;
    try { await api.toggleLike(Number(d.clike)); await loadComments(state.pollId); } catch(err){ toast(err.message, true); t.disabled = false; }
    return true; }
  if (d.cdel){ if (!confirmClick(t, 'Naozaj zmazať?')) return true;
    try { await api.deleteComment(Number(d.cdel)); const q = state.polls.find(x => x.id === state.pollId); if (q) q.comments = Math.max(0, (q.comments || 1) - 1);
      toast('Komentár zmazaný.'); loadComments(state.pollId); const h = $('#disc h3 .small'); if (h && q) h.textContent = `(${komentarov(q.comments)})`; }
    catch(err){ toast(err.message, true); }
    return true; }
  if (d.ptoggle){ const q = state.polls.find(x => x.id === Number(d.ptoggle)); await adminAct(() => api.savePoll({ id: q.id, active: !q.active }), q.active ? 'Anketa uzavretá.' : 'Anketa otvorená.', async () => { state.polls = null; await showAnkety(); }); return true; }
  if (d.pdel){ if (!confirmClick(t, 'Naozaj?')) return true; await adminAct(() => api.deletePoll(Number(d.pdel)), 'Anketa zmazaná.', async () => { state.polls = null; await showAnkety(); }); return true; }
  if (d.draw){ if (!confirmClick(t, 'Naozaj vylosovať?')) return true; await adminAct(async () => { state.lastDraw = await api.drawLottery(Number(d.draw)); }, 'Vylosované!', openSponsor); return true; }
  if (d.ldel){ if (!confirmClick(t, 'Naozaj?')) return true; await adminAct(() => api.deleteLottery(Number(d.ldel)), 'Losovanie zmazané.', openSponsor); return true; }
  if (d.sdel){ if (!confirmClick(t, 'Naozaj?')) return true; await adminAct(() => api.deleteSponsorRequest(Number(d.sdel)), null, openSponsor); return true; }
  if (d.atoggle){ const a = state.anns.find(x => x.id === Number(d.atoggle)); await adminAct(() => api.saveAnnouncement({ id: a.id, active: !a.active }), null, async () => { await loadAnns(); openAnn(); }); return true; }
  if (d.adel){ if (!confirmClick(t, 'Naozaj?')) return true; await adminAct(() => api.deleteAnnouncement(Number(d.adel)), 'Oznámenie zmazané.', async () => { await loadAnns(); openAnn(); }); return true; }
  if (d.tihide){ const i = state.trustById.get(Number(d.tihide)); await adminAct(() => api.saveTrustItem({ id: i.id, active: !i.active }), null, async () => { await openTrustAdmin(); await refreshTrust(); }); return true; }
  if (d.tidel){ if (!confirmClick(t, 'Naozaj? Zmaže aj hlasy')) return true; await adminAct(() => api.deleteTrustItem(Number(d.tidel)), 'Zmazané.', async () => { await openTrustAdmin(); await refreshTrust(); }); return true; }
  switch (d.act){
    case 'sponsor': closeModal(); openSponsor(); return true;
    case 'ann': openAnn(); return true;
    case 'titems': openTrustAdmin(); return true;
    case 'compare': location.hash = detailHash([...state.cmp]); return true;
    case 'cmp-clear': state.cmp.clear(); renderTrustRows(); return true;
    case 'poll-suggest': closeModal(); openPollSuggest(); return true;
    case 'poll-new': openPollNew(); return true;
    case 'interests': openInterests(); return true;
    case 'art-new': openArticleEdit(null); return true;
    case 'asuser': state.asUser = !state.asUser; store.set('mr_as_user', state.asUser); state.ptab = 'public'; state.miss = null;
      renderUser(); render(); route(); toast(state.asUser ? 'Web teraz vidíte ako bežný používateľ.' : 'Web teraz vidíte ako admin.'); return true;
    case 'del-test-users': {
      if (!confirmClick(t, 'Naozaj? Kliknite znova')) return true;
      try { const n = await api.deleteTestUsers(); toast(`Zmazaných ${n} testovacích používateľov.`);
        state.trust = null; state.polls = null; await loadAuth(); await loadPersons(); render(); closeModal(); route(); }
      catch(err){ toast(err.message, true); }
      return true;
    }
  }
  return false;
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('.cmp')){
    const id = Number(t.dataset.cmp);
    if (t.checked){ if (state.cmp.size >= 3){ t.checked = false; return toast('Porovnať môžete najviac 3 položky.', true); } state.cmp.add(id); }
    else state.cmp.delete(id);
    renderCmpBar();
  }
  if (t.dataset.pcatset){ api.savePoll({ id: Number(t.dataset.pcatset), category: t.value }).then(async () => { state.polls = null; await showAnkety(); toast('Kategória zmenená.'); }).catch(err => toast(err.message, true)); }
  if (t.id === 'psort'){ state.psort = t.value; renderPollList(); }
  if (t.id === 'dvAdd' && t.value){ location.hash = detailHash([...state.detailIds, Number(t.value)]); }
});
document.addEventListener('keydown', e => {
  if (state.tab !== 'ankety' || !state.pollId || !state.pnav || !$('#modal').hidden || e.altKey || e.ctrlKey || e.metaKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  const to = e.key === 'ArrowLeft' ? state.pnav.prev : e.key === 'ArrowRight' ? state.pnav.next : null;
  if (to) location.hash = '#anketa-' + to;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset?.open) location.hash = detailHash([Number(e.target.dataset.open)]); });
let resizeT; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawTimeline, 150); });
window.addEventListener('hashchange', route);

/* ---------------- udalosti ---------------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-close], [data-open], [data-act]');
  if (e.target.id === 'modal') return closeModal();
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeModal();
  if (await onExtraClick(t)) return;
  if (t.dataset.vote) return onVote(t);
  if (t.dataset.cat){ state.cat = t.dataset.cat; renderChips(); renderList(); return; }
  if (t.dataset.login){
    try { await api.signIn(t.dataset.login, !!t.dataset.admin); }
    catch(err){ const el = $('#loginErr'); if (el) el.textContent = err.message.includes('not enabled') ? 'Tento spôsob prihlásenia ešte nie je zapnutý v Supabase.' : err.message; }
    return;
  }
  if (t.dataset.edit) return openAdmin(Number(t.dataset.edit));
  if (t.dataset.entityOk){
    const p = (state.all || []).find(x => x.id === Number(t.dataset.entityOk));
    try { await api.savePerson({ ...p, entity: 'osoba' }); await loadPersons(); openAdmin(); toast('Označené ako jeden človek.'); } catch(err){ toast(err.message, true); }
    return;
  }
  if (t.dataset.approve){
    try { await api.approvePerson(Number(t.dataset.approve)); await loadPersons(); render(); openAdmin(); toast('Osobnosť schválená.'); } catch(err){ toast(err.message, true); }
    return;
  }
  if (t.dataset.del){
    if (!confirmClick(t, 'Naozaj?')) return;
    try { await api.deletePerson(Number(t.dataset.del)); await loadPersons(); render(); openAdmin(); toast('Osobnosť zmazaná.'); } catch(err){ toast(err.message, true); }
    return;
  }
  if (t.dataset.reset){
    if (!confirmClick(t)) return;
    try { await api.resetVotes(t.dataset.reset === 'test'); await loadAuth(); await loadPersons(); render(); openAdmin(); toast('Hlasy zmazané.'); } catch(err){ toast(err.message, true); }
    return;
  }
  switch (t.dataset.act){
    case 'login': return openLogin();
    case 'logout': return api.signOut();
    case 'profile': return openProfile();
    case 'admin': return openAdmin();
    case 'theme': {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('mr_theme', next); } catch {}
      renderUser(); if (state.tl) drawTimeline(); return;
    }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#search').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderList(); });

/* ---------------- štart ---------------- */
try {
  api = DEMO ? makeDemoApi() : await makeSupabaseApi();
  await Promise.all([loadAuth(), loadPersons()]);
  render(); route(); loadAnns();
  if (!state.trust) loadTrust().catch(() => {}); else navNov();
  if (state.user && !state.profile) openProfile();
  api.onAuth(async () => { await loadAuth(); render(); route(); navNov(); if (state.user && !state.profile) openProfile(); });
} catch(err){
  console.error(err);
  $('#list').innerHTML = `<div class="empty">Nepodarilo sa načítať dáta: ${esc(err.message)}</div>`;
}
</script>
</body>
</html>
