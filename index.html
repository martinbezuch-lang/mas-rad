<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#151a24; --muted:#6a7282; --line:#e4e7ec;
    --accent:#0b4ea2; --accent-soft:#e7effa;
    --up:#1f9d55; --up-soft:#e3f5ea; --down:#d63b3b; --down-soft:#fbe7e7; --track:#e9ecf1;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.05);
    --head:#fafbfc; --hover:#f3f5f8; --field:#ffffff; --onink:#ffffff;
    --demo-bg:#fff7e0; --demo-line:#f3df9e; --demo-ink:#6b5000;
    color-scheme: light;
  }
  [data-theme="dark"]{
    --bg:#0e1117; --card:#161a22; --ink:#e7e9ee; --muted:#9aa3b3; --line:#272d38;
    --accent:#6ea8ff; --accent-soft:#1b2940;
    --up:#34c06f; --up-soft:#14301f; --down:#ff6b6b; --down-soft:#3a1d1f; --track:#2a303b;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
    --head:#1a1f28; --hover:#1c212b; --field:#0f131a; --onink:#0e1117;
    --demo-bg:#2b2410; --demo-line:#5a4a1a; --demo-ink:#f1d98a;
    color-scheme: dark;
  }
  body{transition:background .2s,color .2s}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  button,input,select{font:inherit;color:inherit}
  button{cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px}

  /* header */
  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em}
  .logo-mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#0b4ea2 0 50%,#d63b3b 50% 100%);display:grid;place-items:center;color:#fff}
  .logo-mark svg{width:18px;height:18px}
  .user{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted);min-width:0}
  .user .email{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{background:var(--ink);color:var(--onink);font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.04em}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;transition:background .15s,border-color .15s}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onink)}
  .btn.primary:hover{filter:brightness(.9);background:var(--accent)}
  .btn.danger{color:var(--down);border-color:#f1c4c4}
  .btn.danger:hover{background:var(--down-soft)}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{background:var(--hover);color:var(--ink)}
  .theme-btn{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;color:var(--ink);flex:none}
  .theme-btn:hover{background:var(--hover)}
  .theme-btn svg{width:18px;height:18px}
  .btn:disabled{opacity:.55;cursor:not-allowed}

  /* hero */
  .hero{padding:34px 0 14px}
  .hero h1{margin:0;font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.03em}
  .hero p{margin:6px 0 0;color:var(--muted);max-width:620px}

  .notice{margin:14px 0 0;padding:10px 14px;border-radius:10px;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .notice.demo{display:block;background:var(--demo-bg);border:1px solid var(--demo-line);color:var(--demo-ink)}
  .notice.admin{background:#151a24;color:#e9ecf1}
  .notice.admin .btn{background:transparent;color:#fff;border-color:#3a4252;padding:5px 10px;font-size:13px}
  .notice.admin .btn:hover{background:#262d3b}
  .notice .spacer{flex:1}

  /* toolbar */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:22px 0 12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;color:var(--muted)}
  .chip .n{opacity:.6;font-weight:500;margin-left:4px}
  .chip:hover{color:var(--ink)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:var(--onink)}
  .tools-right{display:flex;gap:8px;flex-wrap:wrap}
  .search,.sort{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px 12px;font-size:14px}
  .search{width:200px}

  /* list */
  .list{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:40px}
  .row{display:grid;grid-template-columns:48px 2.2fr 56px 120px 168px 150px;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line)}
  .row.head{border-top:0;background:var(--head);font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding-top:12px;padding-bottom:12px}
  .row:not(.head):hover{background:var(--hover)}
  .rank{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .row:not(.head) .rank.top{color:var(--accent)}
  .last{font-weight:700}
  .nick{font-weight:600;color:var(--accent)}
  .detail{display:block;font-weight:500;font-size:12.5px;color:var(--muted)}
  .age{font-variant-numeric:tabular-nums}
  .tag{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
  .votes{display:flex;gap:8px}
  .thumb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;min-width:72px;justify-content:center;transition:transform .08s,background .15s,border-color .15s}
  .thumb svg{width:17px;height:17px;flex:none}
  .thumb.down svg{transform:rotate(180deg) scaleX(-1)}
  .thumb.up:hover:not(:disabled){background:var(--up-soft);border-color:#a8dcbc;color:var(--up)}
  .thumb.down:hover:not(:disabled){background:var(--down-soft);border-color:#efb1b1;color:var(--down)}
  .thumb:active:not(:disabled){transform:scale(.94)}
  .thumb.chosen.up{background:var(--up);border-color:var(--up);color:#fff}
  .thumb.chosen.down{background:var(--down);border-color:var(--down);color:#fff}
  .thumb:disabled:not(.chosen){opacity:.45;cursor:default}
  .thumb:disabled.chosen{cursor:default}
  .chart{display:flex;align-items:center;gap:10px}
  .donut{width:40px;height:40px;flex:none}
  .chart-txt{font-size:12.5px;color:var(--muted);line-height:1.3}
  .chart-txt b{display:block;color:var(--ink);font-size:14px}
  .empty{padding:40px;text-align:center;color:var(--muted)}

  @media (max-width:860px){
    .row.head{display:none}
    .row{grid-template-columns:36px 1fr auto;grid-template-areas:"rank name chart" "rank meta chart" "rank votes votes";row-gap:6px;padding:14px}
    .rank{grid-area:rank;align-self:start;padding-top:2px}
    .namecell{grid-area:name}
    .meta{grid-area:meta;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--muted);font-size:13px}
    .row .age,.row .cat{display:none}
    .votes{grid-area:votes}
    .chart{grid-area:chart;align-self:start}
    .search{width:100%}
    .tools-right{width:100%}
    .tools-right .search{flex:1}
  }
  @media (min-width:861px){ .meta{display:none} }

  /* modal */
  .modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:grid;place-items:center;padding:16px;z-index:50}
  .modal[hidden]{display:none}
  .dialog{background:var(--card);border-radius:18px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25);position:relative}
  .dialog.wide{max-width:760px}
  .dialog h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
  .dialog .sub{margin:0 0 18px;color:var(--muted);font-size:14px}
  .x{position:absolute;top:14px;right:14px;border:0;background:transparent;font-size:22px;line-height:1;color:var(--muted);padding:6px;border-radius:8px}
  .x:hover{background:var(--hover)}
  .oauth{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:var(--field);font-weight:700;margin-bottom:10px}
  .oauth:hover{background:var(--hover)}
  .oauth.fb{background:#1877f2;border-color:#1877f2;color:#fff}
  .oauth.fb:hover{background:#1468d8}
  .oauth svg{width:20px;height:20px}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px;margin:14px 0}
  .or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
  .field{margin-bottom:14px}
  .field label.l{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
  .field input[type=text],.field input[type=email],.field input[type=number],.field input[type=date],.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--field)}
  .field input:focus,.field select:focus,.search:focus,.sort:focus{outline:2px solid #b9cff0;border-color:var(--accent)}
  .seg{display:flex;gap:8px}
  .seg label{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center;font-weight:600;cursor:pointer}
  .seg input{position:absolute;opacity:0;pointer-events:none}
  .seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted)}
  .check input{margin-top:3px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .err{color:var(--down);font-size:13px;min-height:18px;margin:4px 0 8px}
  .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
  .small{font-size:12.5px;color:var(--muted)}

  /* admin table */
  .atable{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:10px}
  .atable th,.atable td{text-align:left;padding:7px 8px;border-top:1px solid var(--line)}
  .atable th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;border-top:0}
  .atable td:last-child{text-align:right;white-space:nowrap}
  .atable tr.pending td{background:var(--demo-bg)}
  .pill{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--demo-line);color:var(--demo-ink)}
  .atable .btn{padding:4px 9px;font-size:12.5px}
  .admin-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  .admin-grid .field{margin-bottom:10px}
  .box{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .box h3{margin:0 0 10px;font-size:15px}
  @media (max-width:640px){.admin-grid,.row2{grid-template-columns:1fr}}

  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--onink);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:all .25s;z-index:60;max-width:calc(100% - 32px)}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.err{background:var(--down)}
  footer{color:var(--muted);font-size:12.5px;text-align:center;padding:0 0 30px}
</style>
</head>

/* ---------------- pomocné ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const collator = new Intl.Collator('sk');
const store = (() => {
  const mem = {};
  return {
    get(k, d){ try{ const v = localStorage.getItem(k); if (v != null) return JSON.parse(v); }catch{} return k in mem ? mem[k] : d; },
    set(k, v){ mem[k] = v; try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
    del(k){ delete mem[k]; try{ localStorage.removeItem(k); }catch{} }
  };
})();
function ageOf(p){
  const now = new Date();
  if (p.birth_date){
    const b = new Date(p.birth_date + 'T00:00:00');
    let a = now.getFullYear() - b.getFullYear();
    if (now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) a--;
    return a;
  }
  return p.birth_year ? now.getFullYear() - p.birth_year : null;
}
function fullName(p){
  const parts = [p.first_name, p.nickname && (p.first_name || p.last_name) ? '„' + p.nickname + '“' : null, p.last_name].filter(Boolean);
  return parts.length ? parts.join(' ') : (p.nickname || '');
}
function sortKey(p){ return p.last_name || p.nickname || p.first_name || ''; }
function nameHTML(p){
  if (!p.first_name && !p.last_name) return `<span class="last">${esc(p.nickname)}</span>`;
  return `<span class="last">${esc(p.first_name || '')}${p.nickname ? ` <span class="nick">„${esc(p.nickname)}“</span>` : ''} ${esc(p.last_name || '')}</span>`;
}
let toastTimer;
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2800);
}

function makeDemoApi(){
  const K = { persons:'mr_persons', votes:'mr_votes', session:'mr_session', profiles:'mr_profiles' };
  if (!store.get(K.persons)){
    let s = 7;
    const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
      store.set(K.persons, SEED.map((r, i) => ({
      id: i + 1, last_name:r[0], first_name:r[1], nickname:r[2], birth_year:r[3], birth_date:r[4], category:r[5], detail:r[6] || null, approved:true,
      seed_up: Math.round(rnd() * 140 + 10), seed_down: Math.round(rnd() * 110 + 5)
    })));
  }
  const persons = () => store.get(K.persons, []);
  const votes = () => store.get(K.votes, []);
  return {
    mode: 'demo',
    async getUser(){ return store.get(K.session, null); },
    onAuth(){},
    async signIn(provider, asAdmin){
      const id = asAdmin ? 'demo-admin' : 'demo-user';
      store.set(K.session, { id, email: (asAdmin ? 'admin' : 'hlasujuci') + '@demo.' + provider, demoAdmin: !!asAdmin });
      location.reload();
    },
    async signInEmail(email){ store.set(K.session, { id:'demo-' + email, email }); location.reload(); },
    async signOut(){ store.del(K.session); location.reload(); },
    async getProfile(uid){
      const p = store.get(K.profiles, {})[uid]; if (!p) return null;
      const sess = store.get(K.session, {});
      return { ...p, is_admin: !!sess.demoAdmin };
    },
    async saveProfile(uid, p){ const all = store.get(K.profiles, {}); all[uid] = p; store.set(K.profiles, all); },
    async listAllPersons(){ return persons(); },
    async approvePerson(id){ store.set(K.persons, persons().map(p => p.id === id ? { ...p, approved: true } : p)); },
    async listPersons(){
      const v = votes();
      return persons().filter(p => p.approved !== false).map(p => ({
        ...p,
        up: p.seed_up + v.filter(x => x.person_id === p.id && x.value === 1).length,
        down: p.seed_down + v.filter(x => x.person_id === p.id && x.value === -1).length
      }));
    },
    async myVotes(uid){ return votes().filter(x => x.user_id === uid && !x.is_test); },
    async vote(uid, isAdmin, pid, value){
      const v = votes();
      if (!isAdmin && v.some(x => x.user_id === uid && x.person_id === pid && !x.is_test))
        throw new Error('Za túto osobnosť ste už hlasovali.');
      v.push({ person_id: pid, user_id: uid, value, is_test: !!isAdmin });
      store.set(K.votes, v);
    },
    async savePerson(p){
      const list = persons();
      if (p.id){ const i = list.findIndex(x => x.id === p.id); list[i] = { ...list[i], ...p }; }
      else { p.id = Math.max(0, ...list.map(x => x.id)) + 1; list.push({ ...p, seed_up:0, seed_down:0 }); }
      store.set(K.persons, list);
    },
    async deletePerson(id){
      store.set(K.persons, persons().filter(x => x.id !== id));
      store.set(K.votes, votes().filter(x => x.person_id !== id));
    },
    async resetVotes(onlyTest){
      store.set(K.votes, onlyTest ? votes().filter(x => !x.is_test) : []);
      if (!onlyTest) store.set(K.persons, persons().map(p => ({ ...p, seed_up:0, seed_down:0 })));
    }
  };
}

/* =====================================================================
   BACKEND: SUPABASE (ostrá prevádzka)
   ===================================================================== */
async function makeSupabaseApi(){
  const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
  const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const redirectTo = location.origin + location.pathname;
  const chk = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    mode: 'live',
    async getUser(){ const { data } = await sb.auth.getSession(); const u = data.session?.user; return u ? { id:u.id, email:u.email } : null; },
    onAuth(cb){ sb.auth.onAuthStateChange((evt) => { if (evt === 'SIGNED_IN' || evt === 'SIGNED_OUT') setTimeout(cb, 0); }); },
    async signIn(provider){ chk(await sb.auth.signInWithOAuth({ provider, options:{ redirectTo } })); },
    async signInEmail(email){ chk(await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: redirectTo } })); },
    async signOut(){ await sb.auth.signOut(); location.reload(); },
    async getProfile(uid){ return chk(await sb.from('profiles').select('*').eq('id', uid).maybeSingle()); },
    async saveProfile(uid, p){
      const exists = chk(await sb.from('profiles').select('id').eq('id', uid).maybeSingle());
      if (exists) chk(await sb.from('profiles').update(p).eq('id', uid));
      else chk(await sb.from('profiles').insert({ id: uid, ...p }));
    },
    async listPersons(){ return chk(await sb.from('person_scores').select('*')); },
    async listAllPersons(){ return chk(await sb.from('persons').select('*').order('last_name')); },
    async approvePerson(id){ chk(await sb.from('persons').update({ approved: true }).eq('id', id)); },
    async myVotes(uid){ return chk(await sb.from('votes').select('person_id,value').eq('user_id', uid).eq('is_test', false)); },
    async vote(uid, isAdmin, pid, value){ chk(await sb.rpc('cast_vote', { p_person_id: pid, p_value: value })); },
    async savePerson(p){
      const row = { last_name:p.last_name, first_name:p.first_name, nickname:p.nickname, birth_year:p.birth_year, birth_date:p.birth_date, category:p.category, detail:p.detail, approved:p.approved };
      if (p.id) chk(await sb.from('persons').update(row).eq('id', p.id));
      else chk(await sb.from('persons').insert(row));
    },
    async deletePerson(id){ chk(await sb.from('persons').delete().eq('id', id)); },
    async resetVotes(onlyTest){ chk(await sb.rpc('reset_votes', { p_only_test: onlyTest })); }
  };
}

function donut(up, down){
  const t = up + down, r = 15.9155;
  const share = t ? up / t * 100 : 0;
  return `<svg class="donut" viewBox="0 0 36 36" role="img" aria-label="${t ? Math.round(share) + ' % palcov hore' : 'bez hlasov'}">
    <circle cx="18" cy="18" r="${r}" fill="none" stroke="${t ? 'var(--down)' : 'var(--track)'}" stroke-width="4.2"/>
    ${t ? `<circle cx="18" cy="18" r="${r}" fill="none" stroke="var(--up)" stroke-width="4.2" stroke-dasharray="${share.toFixed(2)} 100" transform="rotate(-90 18 18)"/>` : ''}
  </svg>`;
}

function sorted(list){
  const ratio = p => (p.up + p.down) ? p.up / (p.up + p.down) : -1;
  const by = {
    score: (a, b) => (b.up - b.down) - (a.up - a.down) || ratio(b) - ratio(a) || (b.up + b.down) - (a.up + a.down),
    ratio: (a, b) => ratio(b) - ratio(a) || (b.up + b.down) - (a.up + a.down),
    votes: (a, b) => (b.up + b.down) - (a.up + a.down),
    name:  () => 0,
    age:   (a, b) => (ageOf(b) ?? -1) - (ageOf(a) ?? -1),
  }[state.sort];
  return [...list].sort((a, b) => by(a, b) || collator.compare(sortKey(a), sortKey(b)) || collator.compare(a.first_name || '', b.first_name || ''));
}

function renderChips(){
  const counts = {}; state.persons.forEach(p => counts[p.category] = (counts[p.category] || 0) + 1);
  const cats = CATEGORIES.filter(c => counts[c]);
  $('#chips').innerHTML = `<button class="chip ${state.cat === 'all' ? 'on' : ''}" data-cat="all">Všetci<span class="n">${state.persons.length}</span></button>` +
    cats.map(c => `<button class="chip ${state.cat === c ? 'on' : ''}" data-cat="${esc(c)}">${esc(c)}<span class="n">${counts[c]}</span></button>`).join('');
}

function renderList(){
  const q = state.q.trim().toLocaleLowerCase('sk');
  const list = sorted(state.persons.filter(p =>
    (state.cat === 'all' || p.category === state.cat) &&
    (!q || `${p.last_name || ''} ${p.first_name || ''} ${p.nickname || ''} ${p.detail || ''}`.toLocaleLowerCase('sk').includes(q))));
  const head = `<div class="row head"><div>#</div><div>Meno a priezvisko</div><div>Vek</div><div>Kategória</div><div>Hlasuj</div><div>Pomer</div></div>`;
  if (!list.length){ $('#list').innerHTML = head + `<div class="empty">Nenašli sa žiadne osobnosti.</div>`; return; }
  $('#list').innerHTML = head + list.map((p, i) => {
    const mine = state.myVotes.get(p.id);
    const locked = !isAdmin() && mine !== undefined;
    const t = p.up + p.down;
    const pct = t ? Math.round(p.up / t * 100) : null;
    const age = ageOf(p);
    return `<div class="row">
      <div class="rank ${i < 3 && state.sort === 'score' ? 'top' : ''}">${i + 1}.</div>
      <div class="namecell">${nameHTML(p)}${p.detail ? `<span class="detail">${esc(p.detail)}</span>` : ''}</div>
      <div class="age">${age ?? '–'}</div>
      <div class="cat"><span class="tag">${esc(p.category)}</span></div>
      <div class="meta">${age != null ? `<span>${age} r.</span>` : ''}<span class="tag">${esc(p.category)}</span></div>
      <div class="votes">
        <button class="thumb up ${mine === 1 ? 'chosen' : ''}" data-vote="1" data-id="${p.id}" ${locked ? 'disabled' : ''} title="Páči sa mi" aria-label="Palec hore pre ${esc(fullName(p))}">${ICON_THUMB}<span>${p.up}</span></button>
        <button class="thumb down ${mine === -1 ? 'chosen' : ''}" data-vote="-1" data-id="${p.id}" ${locked ? 'disabled' : ''} title="Nepáči sa mi" aria-label="Palec dole pre ${esc(fullName(p))}">${ICON_THUMB}<span>${p.down}</span></button>
      </div>
      <div class="chart">${donut(p.up, p.down)}<div class="chart-txt">${pct === null ? '<b>–</b>bez hlasov' : `<b>${pct} %</b>${t} ${t === 1 ? 'hlas' : (t < 5 ? 'hlasy' : 'hlasov')}`}</div></div>
    </div>`;
  }).join('');
}

function render(){ renderUser(); renderChips(); renderList(); }

async function loadPersons(){ state.persons = (await api.listPersons()).map(p => ({ ...p, id: Number(p.id) })); }
async function loadAuth(){
  state.user = await api.getUser();
  state.profile = state.user ? await api.getProfile(state.user.id) : null;
  state.myVotes = new Map();
  if (state.user && state.profile){
    (await api.myVotes(state.user.id)).forEach(v => state.myVotes.set(Number(v.person_id), v.value));
  }
}

  const list = [...state.all].sort((a, b) => (a.approved === false ? 0 : 1) - (b.approved === false ? 0 : 1) || collator.compare(sortKey(a), sortKey(b)));

      <table class="atable"><thead><tr><th>Meno</th><th>Kategória</th><th>Detail</th><th></th></tr></thead><tbody>
      ${list.map(p => `<tr class="${p.approved === false ? 'pending' : ''}"><td><b>${esc(fullName(p))}</b>${ageOf(p) != null ? ` <span class="small">${ageOf(p)} r.</span>` : ''}</td><td>${esc(p.category)}</td><td class="small">${esc(p.detail || '')}</td>
        <td>${p.approved === false ? `<button class="btn primary" data-approve="${p.id}">Schváliť</button> ` : ''}<button class="btn" data-edit="${p.id}">Upraviť</button> <button class="btn danger" data-del="${p.id}">Zmazať</button></td></tr>`).join('')}

  $('#personForm').addEventListener('submit', async e => {
    e.preventDefault();

    catch(err){ $('#aErr').textContent = err.message; }
  });
}

// dvojklikové potvrdenie (alert/confirm v prehliadači nepoužívame)
function confirmClick(btn, label){
  if (btn.dataset.armed){ return true; }
  btn.dataset.armed = '1'; const old = btn.textContent; btn.textContent = label || 'Naozaj? Kliknite znova';
  setTimeout(() => { if (btn.isConnected){ delete btn.dataset.armed; btn.textContent = old; } }, 3500);
  return false;
}

/* ---------------- hlasovanie ---------------- */
async function onVote(btn){
  const pid = Number(btn.dataset.id), value = Number(btn.dataset.vote);
  if (!state.user) return openLogin();
  if (!state.profile) return openProfile();
  if (!isAdmin() && state.myVotes.has(pid)) return toast('Za túto osobnosť ste už hlasovali.', true);
  btn.disabled = true;
  try {
    await api.vote(state.user.id, isAdmin(), pid, value);
    const p = state.persons.find(x => x.id === pid);
    value === 1 ? p.up++ : p.down++;
    if (!isAdmin()) state.myVotes.set(pid, value);
    renderList();
    toast(value === 1 ? '👍 Hlas zaznamenaný' : '👎 Hlas zaznamenaný');
  } catch(err){
    toast(err.message, true); btn.disabled = false;
  }
}

/* ---------------- udalosti ---------------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('button, [data-close]');
  if (e.target.id === 'modal') return closeModal();
  if (!t) return;
  if (t.hasAttribute('data-close')) return closeModal();
  if (t.dataset.vote) return onVote(t);
  if (t.dataset.cat){ state.cat = t.dataset.cat; renderChips(); renderList(); return; }
  if (t.dataset.login){
    try { await api.signIn(t.dataset.login, !!t.dataset.admin); }
    catch(err){ const el = $('#loginErr'); if (el) el.textContent = err.message.includes('not enabled') ? 'Tento spôsob prihlásenia ešte nie je zapnutý v Supabase.' : err.message; }
    return;
  }
  if (t.dataset.edit) return openAdmin(Number(t.dataset.edit));
  if (t.dataset.approve){
    try { await api.approvePerson(Number(t.dataset.approve)); await loadPersons(); render(); openAdmin(); toast('Osobnosť schválená.'); } catch(err){ toast(err.message, true); }
    return;
  }
  if (t.dataset.del){
    if (!confirmClick(t, 'Naozaj?')) return;
    try { await api.deletePerson(Number(t.dataset.del)); await loadPersons(); render(); openAdmin(); toast('Osobnosť zmazaná.'); } catch(err){ toast(err.message, true); }
    return;
  }
  if (t.dataset.reset){
    if (!confirmClick(t)) return;
    try { await api.resetVotes(t.dataset.reset === 'test'); await loadAuth(); await loadPersons(); render(); openAdmin(); toast('Hlasy zmazané.'); } catch(err){ toast(err.message, true); }
    return;
  }
  switch (t.dataset.act){
    case 'login': return openLogin();
    case 'logout': return api.signOut();
    case 'profile': return openProfile();
    case 'admin': return openAdmin();
    case 'theme': {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('mr_theme', next); } catch {}
      return renderUser();
    }
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });
$('#search').addEventListener('input', e => { state.q = e.target.value; renderList(); });
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderList(); });

/* ---------------- štart ---------------- */
try {
  api = DEMO ? makeDemoApi() : await makeSupabaseApi();
  await Promise.all([loadAuth(), loadPersons()]);
  render();
  if (state.user && !state.profile) openProfile();
  api.onAuth(async () => { await loadAuth(); render(); if (state.user && !state.profile) openProfile(); });
} catch(err){
  console.error(err);
  $('#list').innerHTML = `<div class="empty">Nepodarilo sa načítať dáta: ${esc(err.message)}</div>`;
}
</script>
